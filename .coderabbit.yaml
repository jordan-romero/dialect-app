# CodeRabbit Configuration
# Documentation: https://docs.coderabbit.ai

# Language settings
language: en-US

# Review settings
reviews:
  # Enable automatic reviews on pull requests
  auto_review:
    enabled: true
    # Review draft PRs
    drafts: false

  # Request changes threshold (number of issues before requesting changes)
  request_changes_workflow: false

  # High level summary
  high_level_summary: true

  # Poem style summary
  poem: true

  # Review status
  review_status: true

  # Collapse walkthrough details
  collapse_walkthrough: false

  # Enable incremental reviews (only review changed lines in new commits)
  incremental_review: true

  # Path-based instructions for different parts of the codebase
  path_instructions:
    - path: 'components/**/*.tsx'
      instructions: |
        - Check for proper TypeScript types
        - Ensure React hooks follow rules of hooks
        - Verify accessibility (a11y) attributes
        - Check for proper error handling
        - Look for potential performance issues

    - path: 'components/**/*.ts'
      instructions: |
        - Verify TypeScript types are properly defined
        - Check for proper error handling
        - Look for code reusability opportunities

    - path: 'pages/**/*.tsx'
      instructions: |
        - Check for proper Next.js patterns
        - Verify SEO metadata
        - Check for proper page-level error handling

    - path: '**/*.css'
      instructions: |
        - Check for consistent styling patterns
        - Look for potential CSS conflicts
        - Verify responsive design considerations

    - path: '**/*.test.ts'
      instructions: |
        - Ensure tests are comprehensive
        - Check for edge cases
        - Verify test descriptions are clear

# Chat settings
chat:
  # Enable chat commands in PR comments
  auto_reply: true

# Tone of reviews
tone_instructions: 'Be helpful, constructive, and friendly. Focus on code quality, best practices, and potential bugs.'

# Files to ignore in reviews
ignore:
  - '**/*.md'
  - '**/*.json'
  - '**/package-lock.json'
  - '**/yarn.lock'
  - '**/.next/**'
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'

# Enable/disable specific review features
enable_free_tier: true

# Project context (for maintainers; CodeRabbit's knowledge_base is an object,
# not free text, so the project facts live here as comments):
# - Next.js app for Acting Accents, a dialect training platform
# - TypeScript, React, Chakra UI, Auth0 authentication, Prisma + Supabase
# - The IPA (International Phonetic Alphabet) keyboard is a key feature
# - Focus on accessibility and UX for actors and linguists
knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto

# Review effort estimation
review_effort_levels:
  - name: 'simple'
    max_files: 3
    max_lines: 100
  - name: 'moderate'
    max_files: 10
    max_lines: 500
  - name: 'complex'
    max_files: 20
    max_lines: 1000
  - name: 'epic'
    max_files: 50
    max_lines: 2500
